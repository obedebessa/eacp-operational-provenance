apiVersion: v1
kind: Namespace
metadata:
  name: eacp-k8s-eval
  labels:
    app.kubernetes.io/part-of: eacp-kubernetes-evaluation
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eacp-observer
  namespace: eacp-k8s-eval
  labels:
    app.kubernetes.io/part-of: eacp-kubernetes-evaluation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eacp-observer
  namespace: eacp-k8s-eval
rules:
  - apiGroups: [""]
    resources: ["configmaps", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eacp-observer
  namespace: eacp-k8s-eval
subjects:
  - kind: ServiceAccount
    name: eacp-observer
    namespace: eacp-k8s-eval
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eacp-observer
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: eacp-workload-config
  namespace: eacp-k8s-eval
  labels:
    app.kubernetes.io/name: eacp-demo
    app.kubernetes.io/part-of: eacp-kubernetes-evaluation
data:
  mode: evaluation
  provenance: kubernetes-audit
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eacp-demo
  namespace: eacp-k8s-eval
  labels:
    app.kubernetes.io/name: eacp-demo
    app.kubernetes.io/part-of: eacp-kubernetes-evaluation
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: eacp-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eacp-demo
        app.kubernetes.io/part-of: eacp-kubernetes-evaluation
    spec:
      serviceAccountName: eacp-observer
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 20m
              memory: 16Mi
