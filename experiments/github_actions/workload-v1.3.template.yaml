apiVersion: v1
kind: Namespace
metadata:
  name: eacp-cross-plane-v13
  labels:
    app.kubernetes.io/part-of: eacp-cross-plane-v1-3
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eacp-observer
  namespace: eacp-cross-plane-v13
  labels:
    app.kubernetes.io/part-of: eacp-cross-plane-v1-3
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eacp-observer
  namespace: eacp-cross-plane-v13
rules:
  - apiGroups: [""]
    resources: ["configmaps", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eacp-observer
  namespace: eacp-cross-plane-v13
subjects:
  - kind: ServiceAccount
    name: eacp-observer
    namespace: eacp-cross-plane-v13
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eacp-observer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eacp-cross-plane
  namespace: eacp-cross-plane-v13
  labels:
    app.kubernetes.io/name: eacp-cross-plane
    app.kubernetes.io/part-of: eacp-cross-plane-v1-3
  annotations:
    eacp.io/correlation-id: __CORRELATION_ID__
    eacp.io/source-plane: "github-actions"
    eacp.io/github-repository: __GITHUB_REPOSITORY__
    eacp.io/github-repository-id: __GITHUB_REPOSITORY_ID__
    eacp.io/github-run-id: __GITHUB_RUN_ID__
    eacp.io/github-run-attempt: __GITHUB_RUN_ATTEMPT__
    eacp.io/github-commit-sha: __GITHUB_HEAD_SHA__
    eacp.io/github-source-url: __GITHUB_SOURCE_URL__
    eacp.io/subject-uri: __SUBJECT_URI__
    eacp.io/subject-digest: __SUBJECT_DIGEST__
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: eacp-cross-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eacp-cross-plane
        app.kubernetes.io/part-of: eacp-cross-plane-v1-3
      annotations:
        eacp.io/correlation-id: __CORRELATION_ID__
        eacp.io/github-repository-id: __GITHUB_REPOSITORY_ID__
        eacp.io/github-run-id: __GITHUB_RUN_ID__
        eacp.io/github-run-attempt: __GITHUB_RUN_ATTEMPT__
        eacp.io/github-commit-sha: __GITHUB_HEAD_SHA__
        eacp.io/subject-uri: __SUBJECT_URI__
        eacp.io/subject-digest: __SUBJECT_DIGEST__
    spec:
      serviceAccountName: eacp-observer
      containers:
        - name: subject
          image: __SUBJECT_IMAGE__
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 20m
              memory: 16Mi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: negative-control-no-correlation
  namespace: eacp-cross-plane-v13
  labels:
    app.kubernetes.io/name: eacp-negative-control
    app.kubernetes.io/part-of: eacp-cross-plane-v1-3
    eacp.io/control: negative-no-correlation
data:
  purpose: "negative control: emitted without eacp.io/correlation-id"
