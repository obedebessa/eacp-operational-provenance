name: EACP operability candidate (no attestation)
on:
  pull_request:
    paths:
      - "eacp_hardening/**"
      - "tests/operability/**"
      - "pyproject.toml"
      - ".github/workflows/eacp-operability-v1.5.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installed-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Install the actual distribution
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install .
      - name: Test contracts with assertions optimized out of production
        run: python -O -m unittest discover -s tests/operability -v
      - name: Exercise installed CLI outside checkout
        working-directory: ${{ runner.temp }}
        run: python -I -m eacp_hardening demo --output-directory installed-demo
      - name: Preserve historical source and candidate identity
        run: python scripts/verify_candidate_v1_5.py --freeze
