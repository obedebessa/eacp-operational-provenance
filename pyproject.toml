[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "eacp-operational-provenance"
version = "1.1.0"
description = "Reproducibility artifact for a lightweight evidence-aware control plane"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Obede Bessa Rocha da Silva" }
]
keywords = [
  "operational provenance",
  "cloud-native",
  "Kubernetes",
  "OpenTelemetry",
  "reproducibility"
]
dependencies = []

[project.optional-dependencies]
figures = ["Pillow>=10,<13"]

[project.urls]
Repository = "https://github.com/obedebessa/eacp-operational-provenance"

[tool.setuptools]
packages = []

[tool.unittest]
start-directory = "tests"
