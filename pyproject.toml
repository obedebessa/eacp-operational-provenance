[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "eacp-operational-provenance"
version = "1.4.0"
description = "EACP collection security and resilience reference artifact with preserved Profile 1.3 experiments"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Obede Bessa Rocha da Silva" }
]
keywords = [
  "operational provenance",
  "cloud-native",
  "Kubernetes",
  "OpenTelemetry",
  "reproducibility"
]
dependencies = []

[project.optional-dependencies]
figures = ["Pillow>=10,<13"]
hardening = ["cryptography==50.0.1"]

[project.scripts]
eacp-hardening = "eacp_hardening.cli:main"

[project.urls]
Repository = "https://github.com/obedebessa/eacp-operational-provenance"

[tool.setuptools]
packages = ["eacp_hardening"]

[tool.unittest]
start-directory = "tests"
