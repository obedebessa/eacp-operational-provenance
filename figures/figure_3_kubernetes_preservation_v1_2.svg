<title id="title">Figure 3. Kubernetes laboratory and corpus-preservation exercise</title>
<desc id="desc">A frozen sanitized corpus of 374 Kubernetes audit records was replayed through EACP and an OpenTelemetry reference pipeline. Both retained all records, and an external canonical projection check matched all 4,862 compared values. No performance ranking is shown.</desc>
<metadata>Generated from the archived EACP v1.2 experiment inputs; all elements are vector-native.</metadata>
