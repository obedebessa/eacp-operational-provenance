    <path d="M0,0 L28,14 L0,28 Z" fill="#1E5A7A"/>
  </marker>
  <marker id="arrow-gold" markerWidth="28" markerHeight="28" refX="24" refY="14" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L28,14 L0,28 Z" fill="#D7A62A"/>
  </marker>
