<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1400" viewBox="0 0 2400 1400" role="img" aria-labelledby="title desc">
<title id="title">Figure 1. Evidence-Aware Control Plane architecture</title>
<desc id="desc">Heterogeneous source planes feed an asynchronous EACP evidence path, which supports operational uses while remaining separate from the application data path.</desc>
<metadata>Generated from the archived EACP v1.2 experiment inputs; all elements are vector-native.</metadata>
<defs>
  <marker id="arrow-teal" markerWidth="28" markerHeight="28" refX="24" refY="14" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L28,14 L0,28 Z" fill="#167C80"/>
  </marker>
  <marker id="arrow-blue" markerWidth="28" markerHeight="28" refX="24" refY="14" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L28,14 L0,28 Z" fill="#1E5A7A"/>
  </marker>
  <marker id="arrow-gold" markerWidth="28" markerHeight="28" refX="24" refY="14" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L28,14 L0,28 Z" fill="#D7A62A"/>
  </marker>
  <marker id="arrow-mid" markerWidth="28" markerHeight="28" refX="24" refY="14" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L28,14 L0,28 Z" fill="#6B7B86"/>
  </marker>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; }
    .navy { fill: #14324B; }
    .ink { fill: #24313A; }
    .mid { fill: #6B7B86; }
    .blue { fill: #1E5A7A; }
    .teal { fill: #167C80; }
    .gold { fill: #D7A62A; }
    .bold { font-weight: 700; }
  </style>
</defs>
<rect x="0" y="0" width="2400" height="1400" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/>
<text x="100" y="105" font-size="58" fill="#14324B" font-weight="700" text-anchor="start">Evidence-Aware Control Plane (EACP)</text>
<text x="100" y="160" font-size="30" fill="#6B7B86" font-weight="400" text-anchor="start">Asynchronous cross-plane operational provenance with a separate application data path</text>
<text x="100" y="230" font-size="27" fill="#1E5A7A" font-weight="700" text-anchor="start">HETEROGENEOUS SOURCE PLANES</text>
<rect x="100" y="255" width="510" height="90" rx="20" fill="#E8F1F7" stroke="#1E5A7A" stroke-width="4"/>
<text x="355" y="304" font-size="29" fill="#14324B" font-weight="700" text-anchor="middle" dominant-baseline="middle">CI/CD records</text>
<rect x="100" y="365" width="510" height="90" rx="20" fill="#E8F1F7" stroke="#1E5A7A" stroke-width="4"/>
<text x="355" y="414" font-size="29" fill="#14324B" font-weight="700" text-anchor="middle" dominant-baseline="middle">Identity / IAM events</text>
<rect x="100" y="475" width="510" height="90" rx="20" fill="#E8F1F7" stroke="#1E5A7A" stroke-width="4"/>
<text x="355" y="524" font-size="29" fill="#14324B" font-weight="700" text-anchor="middle" dominant-baseline="middle">Orchestration / audit events</text>
<rect x="100" y="585" width="510" height="90" rx="20" fill="#E8F1F7" stroke="#1E5A7A" stroke-width="4"/>
<text x="355" y="634" font-size="29" fill="#14324B" font-weight="700" text-anchor="middle" dominant-baseline="middle">Policy decisions</text>
<rect x="100" y="695" width="510" height="90" rx="20" fill="#E8F1F7" stroke="#1E5A7A" stroke-width="4"/>
<text x="355" y="744" font-size="29" fill="#14324B" font-weight="700" text-anchor="middle" dominant-baseline="middle">Telemetry signals</text>
<rect x="100" y="805" width="510" height="90" rx="20" fill="#E8F1F7" stroke="#1E5A7A" stroke-width="4"/>
<text x="355" y="854" font-size="29" fill="#14324B" font-weight="700" text-anchor="middle" dominant-baseline="middle">Incident / recovery records</text>
<line x1="685" y1="300" x2="685" y2="850" stroke="#167C80" stroke-width="6" stroke-linecap="round"/>
<line x1="620" y1="300" x2="677" y2="300" stroke="#167C80" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
<line x1="620" y1="410" x2="677" y2="410" stroke="#167C80" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
<line x1="620" y1="520" x2="677" y2="520" stroke="#167C80" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
<line x1="620" y1="630" x2="677" y2="630" stroke="#167C80" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
<line x1="620" y1="740" x2="677" y2="740" stroke="#167C80" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
<line x1="620" y1="850" x2="677" y2="850" stroke="#167C80" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
<line x1="685" y1="375" x2="835" y2="375" stroke="#167C80" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
<text x="392" y="930" font-size="22" fill="#167C80" font-weight="700" text-anchor="middle">asynchronous observation</text>
<rect x="780" y="215" width="1015" height="765" rx="28" fill="#F8FAFB" stroke="#167C80" stroke-width="6"/>
<text x="835" y="275" font-size="32" fill="#167C80" font-weight="700" text-anchor="start">EACP EVIDENCE PATH</text>
<rect x="850" y="325" width="875" height="110" rx="18" fill="#FFFFFF" stroke="#167C80" stroke-width="3"/>
<text x="878" y="367" font-size="28" fill="#14324B" font-weight="700" text-anchor="start">1  Source adapters</text>
<text x="878" y="407" font-size="22" fill="#24313A" font-weight="400" text-anchor="start">Map native identifiers and retain source pointers</text>
<line x1="1287.5" y1="443" x2="1287.5" y2="468" stroke="#167C80" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
<rect x="850" y="480" width="875" height="110" rx="18" fill="#DCEFF0" stroke="#167C80" stroke-width="3"/>
<text x="878" y="522" font-size="28" fill="#14324B" font-weight="700" text-anchor="start">2  Normalizer and correlation engine</text>
<text x="878" y="562" font-size="22" fill="#24313A" font-weight="400" text-anchor="start">Bind service, intent, policy, action, outcome, and correlation</text>
<line x1="1287.5" y1="598" x2="1287.5" y2="623" stroke="#167C80" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
<rect x="850" y="635" width="875" height="140" rx="18" fill="#FFFFFF" stroke="#167C80" stroke-width="3"/>
<text x="878" y="677" font-size="28" fill="#14324B" font-weight="700" text-anchor="start">3  Append-only evidence index</text>
<text x="878" y="717" font-size="22" fill="#24313A" font-weight="400" text-anchor="start">Idempotent source key - indexed queries - SHA-256 content hash</text>
<line x1="1287.5" y1="783" x2="1287.5" y2="808" stroke="#167C80" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
<rect x="850" y="820" width="875" height="110" rx="18" fill="#DCEFF0" stroke="#167C80" stroke-width="3"/>
<text x="878" y="862" font-size="28" fill="#14324B" font-weight="700" text-anchor="start">4  Query and evidence-package API</text>
<text x="878" y="902" font-size="22" fill="#24313A" font-weight="400" text-anchor="start">State timeline - cross-plane chain - source-artifact links</text>
<text x="1900" y="230" font-size="27" fill="#1E5A7A" font-weight="700" text-anchor="start">OPERATIONAL USES</text>
<rect x="1900" y="290" width="405" height="145" rx="22" fill="#FAF2D6" stroke="#D7A62A" stroke-width="4"/>
<text x="2102.5" y="345" font-size="30" fill="#14324B" font-weight="700" text-anchor="middle"><tspan x="2102.5" dy="0">Service-state</tspan><tspan x="2102.5" dy="34">reconstruction</tspan></text>
<line x1="1805" y1="362.5" x2="1886" y2="362.5" stroke="#D7A62A" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow-gold)"/>
<rect x="1900" y="500" width="405" height="145" rx="22" fill="#FAF2D6" stroke="#D7A62A" stroke-width="4"/>
<text x="2102.5" y="564" font-size="30" fill="#14324B" font-weight="700" text-anchor="middle"><tspan x="2102.5" dy="0">Policy-drift investigation</tspan></text>
<line x1="1805" y1="572.5" x2="1886" y2="572.5" stroke="#D7A62A" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow-gold)"/>
<rect x="1900" y="710" width="405" height="145" rx="22" fill="#FAF2D6" stroke="#D7A62A" stroke-width="4"/>
<text x="2102.5" y="765" font-size="30" fill="#14324B" font-weight="700" text-anchor="middle"><tspan x="2102.5" dy="0">Incident evidence</tspan><tspan x="2102.5" dy="34">package</tspan></text>
<line x1="1805" y1="782.5" x2="1886" y2="782.5" stroke="#D7A62A" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow-gold)"/>
<line x1="780" y1="1015" x2="1795" y2="1015" stroke="#167C80" stroke-width="4" stroke-linecap="round" stroke-dasharray="18 16"/>
<text x="1287.5" y="1045" font-size="22" fill="#167C80" font-weight="700" text-anchor="middle">separate evidence path; no request-path dependency</text>
<rect x="100" y="1080" width="2205" height="235" rx="28" fill="#F3F5F7" stroke="#D8E0E5" stroke-width="4"/>
<text x="150" y="1135" font-size="28" fill="#6B7B86" font-weight="700" text-anchor="start">APPLICATION DATA PATH - UNCHANGED BY DEFAULT</text>
<rect x="230" y="1190" width="340" height="80" rx="15" fill="#FFFFFF" stroke="#6B7B86" stroke-width="3"/>
<text x="400" y="1233" font-size="25" fill="#24313A" font-weight="700" text-anchor="middle" dominant-baseline="middle">User request</text>
<rect x="825" y="1190" width="400" height="80" rx="15" fill="#FFFFFF" stroke="#6B7B86" stroke-width="3"/>
<text x="1025" y="1233" font-size="25" fill="#24313A" font-weight="700" text-anchor="middle" dominant-baseline="middle">Application service</text>
<rect x="1510" y="1190" width="400" height="80" rx="15" fill="#FFFFFF" stroke="#6B7B86" stroke-width="3"/>
<text x="1710" y="1233" font-size="25" fill="#24313A" font-weight="700" text-anchor="middle" dominant-baseline="middle">Data / downstream API</text>
<line x1="580" y1="1230" x2="810" y2="1230" stroke="#6B7B86" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-mid)"/>
<line x1="1235" y1="1230" x2="1495" y2="1230" stroke="#6B7B86" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-mid)"/>
